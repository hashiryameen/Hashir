<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="50%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#080B0E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F228"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A77A"/>
      <stop offset="100%" stop-color="#C58557"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Aura -->
  <circle cx="200" cy="210" r="150" fill="#B8F228" opacity="0.08" filter="blur(20px)"/>
  
  <!-- Shoulders & Suit -->
  <path d="M 60 500 C 70 380, 120 330, 200 330 C 280 330, 330 380, 340 500 Z" fill="url(#suitGrad)"/>
  
  <!-- Inner Shirt & Collar -->
  <polygon points="175,330 225,330 208,410 192,410" fill="#FFFFFF"/>
  <polygon points="170,330 192,410 155,345" fill="#CBD5E1"/>
  <polygon points="230,330 208,410 245,345" fill="#E2E8F0"/>
  
  <!-- Lime Accent Tie/Detail -->
  <polygon points="196,380 204,380 206,470 194,470" fill="url(#accentGrad)"/>
  
  <!-- Neck -->
  <rect x="178" y="260" width="44" height="80" rx="10" fill="url(#skinGrad)"/>
  
  <!-- Head & Face -->
  <ellipse cx="200" cy="205" rx="65" ry="80" fill="url(#skinGrad)"/>
  
  <!-- Hair -->
  <path d="M 130 195 C 130 120, 160 110, 200 110 C 240 110, 270 120, 270 195 C 265 170, 245 135, 200 135 C 155 135, 135 170, 130 195 Z" fill="#1C1917"/>
  
  <!-- Well-groomed light beard & jawline -->
  <path d="M 148 215 C 150 270, 180 285, 200 285 C 220 285, 250 270, 252 215 C 240 255, 215 272, 200 272 C 185 272, 160 255, 148 215 Z" fill="#292524" opacity="0.75"/>
  
  <!-- Eyes & Eyebrows -->
  <path d="M 165 175 Q 178 172 188 175" stroke="#1C1917" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 212 175 Q 222 172 235 175" stroke="#1C1917" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="177" cy="190" r="4.5" fill="#1C1917"/>
  <circle cx="223" cy="190" r="4.5" fill="#1C1917"/>
  
  <!-- Nose -->
  <path d="M 200 185 L 196 215 L 204 215" stroke="#9A6138" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Confident Smile -->
  <path d="M 185 235 Q 200 245 215 235" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Professional Badge -->
  <g transform="translate(140, 440)">
    <rect width="120" height="28" rx="14" fill="#0A0E13" stroke="#B8F228" stroke-width="1.5"/>
    <text x="60" y="18" fill="#B8F228" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">HASHIR YAMEEN</text>
  </g>
</svg>
