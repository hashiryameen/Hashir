<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Google Ads Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#ffffff" />
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Left Side Hamburger & Logo -->
  <line x1="16" y1="20" x2="32" y2="20" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="25" x2="32" y2="25" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="30" x2="32" y2="30" stroke="#5f6368" stroke-width="2" stroke-linecap="round" />

  <!-- Google Ads Logo -->
  <g transform="translate(48, 12)">
    <!-- Colored Google Ads shape -->
    <path d="M 6 18 L 14 4 A 4 4 0 0 1 20 4 L 20 4 A 4 4 0 0 1 20 10 L 12 24 A 4 4 0 0 1 6 24 Z" fill="#FBBC04" transform="rotate(-35 12 14)" />
    <circle cx="21" cy="7" r="4.5" fill="#4285F4" />
    <path d="M 21 7 L 14 20 A 4 4 0 0 1 9 22 L 9 22 A 4 4 0 0 1 7 16 L 14 4 Z" fill="#34A853" />
    <text x="32" y="19" font-size="17" font-weight="500" fill="#5f6368">Google Ads</text>
  </g>

  <!-- Search Input Bar -->
  <rect x="200" y="8" width="460" height="32" rx="8" fill="#f1f3f4" />
  <circle cx="216" cy="24" r="6" stroke="#5f6368" stroke-width="1.5" fill="none" />
  <line x1="221" y1="29" x2="227" y2="35" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" />
  <text x="238" y="29" font-size="12" fill="#70757a">What are my top performing campaigns?</text>

  <!-- Right Top Tools & Account Info -->
  <g transform="translate(780, 16)">
    <text x="0" y="12" font-size="11" fill="#5f6368">Appearance</text>
    <text x="75" y="12" font-size="11" fill="#5f6368">Refresh</text>
    <text x="130" y="12" font-size="11" fill="#5f6368">Help</text>
    <text x="170" y="12" font-size="11" fill="#5f6368">Notifications</text>
    <text x="250" y="12" font-size="11" fill="#5f6368">Ask Advisor</text>
    
    <!-- User Account -->
    <text x="330" y="12" font-size="11" font-weight="500" fill="#3c4043">hashirperkslogic@gmail.com</text>
    <circle cx="410" cy="8" r="11" fill="#1a73e8" />
    <text x="410" y="12" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">H</text>
  </g>

  <!-- Left Sidebar Navigation Rail -->
  <rect x="0" y="48" width="60" height="472" fill="#ffffff" />
  <line x1="60" y1="48" x2="60" y2="520" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- + Create Button -->
  <g transform="translate(10, 60)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#dadce0" stroke-width="1" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))" />
    <line x1="20" y1="12" x2="20" y2="28" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="20" x2="28" y2="20" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
    <text x="20" y="48" font-size="10" fill="#5f6368" text-anchor="middle">Create</text>
  </g>

  <!-- Campaigns Nav (Active Blue) -->
  <g transform="translate(10, 130)">
    <rect x="4" y="0" width="32" height="32" rx="16" fill="#e8f0fe" />
    <path d="M 14 12 L 26 12 L 23 20 L 17 20 Z" fill="#1a73e8" />
    <circle cx="20" cy="16" r="3" fill="#1a73e8" />
    <text x="20" y="44" font-size="9" font-weight="600" fill="#1a73e8" text-anchor="middle">Campaigns</text>
  </g>

  <!-- Other Nav Items -->
  <g transform="translate(10, 200)">
    <circle cx="20" cy="14" r="8" fill="none" stroke="#5f6368" stroke-width="1.5" />
    <text x="20" y="34" font-size="9" fill="#5f6368" text-anchor="middle">Goals</text>
  </g>
  <g transform="translate(10, 255)">
    <path d="M 15 10 L 25 20 M 25 10 L 15 20" stroke="#5f6368" stroke-width="1.5" />
    <text x="20" y="34" font-size="9" fill="#5f6368" text-anchor="middle">Tools</text>
  </g>
  <g transform="translate(10, 310)">
    <rect x="13" y="8" width="14" height="10" rx="1" fill="none" stroke="#5f6368" stroke-width="1.5" />
    <text x="20" y="34" font-size="9" fill="#5f6368" text-anchor="middle">Billing</text>
  </g>
  <g transform="translate(10, 365)">
    <circle cx="20" cy="14" r="7" stroke="#5f6368" stroke-width="1.5" fill="none" />
    <text x="20" y="34" font-size="9" fill="#5f6368" text-anchor="middle">Admin</text>
  </g>

  <!-- Main Content Dashboard Canvas -->
  <g transform="translate(80, 56)">
    <!-- Subheader Bar -->
    <text x="0" y="24" font-size="22" font-weight="400" fill="#202124">Overview</text>
    
    <!-- View (2 filters) All campaigns dropdown -->
    <g transform="translate(110, 6)">
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#ffffff" stroke="#dadce0" />
      <text x="8" y="11" font-size="9" fill="#5f6368">View (2 filters)</text>
      <text x="8" y="21" font-size="11" font-weight="600" fill="#202124">🏠 All campaigns</text>
    </g>

    <!-- Date selector & pagination on right -->
    <g transform="translate(730, 6)">
      <rect x="0" y="0" width="160" height="28" rx="4" fill="#ffffff" stroke="#dadce0" />
      <text x="8" y="18" font-size="11" fill="#3c4043">Custom</text>
      <line x1="55" y1="4" x2="55" y2="24" stroke="#e0e0e0" />
      <text x="62" y="18" font-size="11" font-weight="500" fill="#202124">Feb 17 – Oct 8, 2026</text>
      <text x="145" y="18" font-size="10" fill="#5f6368">▾</text>

      <!-- Prev / Next arrows -->
      <text x="175" y="19" font-size="14" fill="#5f6368">‹</text>
      <text x="200" y="19" font-size="14" fill="#5f6368">›</text>
      
      <!-- Show last 30 days link -->
      <text x="230" y="18" font-size="11" font-weight="500" fill="#1a73e8">Show last 30 days</text>
    </g>

    <!-- Google Ads AI / Performance Insights Banner -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="1090" height="58" rx="6" fill="#f8f9fa" stroke="#e8eaed" />
      <text x="18" y="20" font-size="11.5" fill="#3c4043">• Of the 10 campaigns, 10 had an increase in clicks and 0 had a decrease. 2 top contributing campaigns drove 410 of the clicks increase.</text>
      <text x="18" y="38" font-size="11.5" fill="#3c4043">• Potential reasons for this change: keyword targeting changed for 8 campaigns, bids changed for 9 campaigns, auction activity changed for 4 campaigns, and ads eligibility changed for 2 campaigns.</text>
      <text x="1000" y="50" font-size="10" fill="#70757a">Google AI is experimental. <tspan fill="#1a73e8">Terms</tspan></text>
    </g>

    <!-- 4 Colored KPI Metric Cards (Exact match to real screenshot) -->
    <g transform="translate(0, 110)">
      <!-- 1. Clicks: 10.7K (Solid Blue) -->
      <rect x="0" y="0" width="135" height="74" fill="#1a73e8" rx="3 0 0 0" />
      <text x="14" y="20" font-size="11" font-weight="600" fill="#ffffff">▾ Clicks</text>
      <text x="14" y="52" font-size="28" font-weight="700" fill="#ffffff">10.7K</text>

      <!-- 2. Impressions: 115K (Solid Red) -->
      <rect x="135" y="0" width="135" height="74" fill="#d93025" />
      <text x="149" y="20" font-size="11" font-weight="600" fill="#ffffff">▾ Impressions</text>
      <text x="149" y="52" font-size="28" font-weight="700" fill="#ffffff">115K</text>

      <!-- 3. Avg. CPC: Rs429 (White / Light Slate) -->
      <rect x="270" y="0" width="135" height="74" fill="#f8f9fa" stroke="#dadce0" stroke-width="1" />
      <text x="284" y="20" font-size="11" font-weight="600" fill="#3c4043">▾ Avg. CPC</text>
      <text x="284" y="52" font-size="26" font-weight="700" fill="#202124">Rs429</text>

      <!-- 4. Cost: Rs4.6M (Solid Golden Amber) -->
      <rect x="405" y="0" width="135" height="74" fill="#f9ab00" rx="0 3 0 0" />
      <text x="419" y="20" font-size="11" font-weight="700" fill="#202124">▾ Cost</text>
      <text x="419" y="52" font-size="26" font-weight="700" fill="#202124">Rs4.6M</text>

      <!-- Right Action Icons: Metrics, Adjust -->
      <g transform="translate(970, 24)">
        <text x="0" y="16" font-size="11" fill="#5f6368">📊 Metrics</text>
        <text x="65" y="16" font-size="11" fill="#5f6368">⚙ Adjust</text>
        <text x="115" y="16" font-size="13" fill="#5f6368">⋮</text>
      </g>
    </g>

    <!-- Graph Container -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="1090" height="150" fill="#ffffff" stroke="#dadce0" stroke-width="1" />
      
      <!-- Horizontal Graph Gridlines -->
      <line x1="30" y1="35" x2="1060" y2="35" stroke="#f1f3f4" stroke-width="1" />
      <line x1="30" y1="70" x2="1060" y2="70" stroke="#f1f3f4" stroke-width="1" />
      <line x1="30" y1="105" x2="1060" y2="105" stroke="#f1f3f4" stroke-width="1" />
      
      <!-- Authentic Trend Lines from screenshot -->
      <!-- Red Impressions Line -->
      <path d="M 40 142 L 140 142 Q 180 140 210 110 T 260 25 T 310 40 T 360 70 T 420 50 T 480 85 T 540 85 T 600 45 T 670 70 T 730 65 T 790 40 T 850 50 L 900 95" fill="none" stroke="#d93025" stroke-width="2.5" />

      <!-- Blue Clicks Line -->
      <path d="M 40 143 L 140 143 Q 180 141 210 120 T 260 45 T 310 55 T 360 80 T 420 65 T 480 92 T 540 92 T 600 55 T 670 78 T 730 75 T 790 52 T 850 62 L 900 102" fill="none" stroke="#1a73e8" stroke-width="2.5" />

      <!-- Amber Cost Line -->
      <path d="M 40 144 L 140 144 Q 180 142 210 115 T 260 35 T 310 48 T 360 72 T 420 60 T 480 88 T 540 88 T 600 48 T 670 72 T 730 68 T 790 45 T 850 55 L 900 98" fill="none" stroke="#f9ab00" stroke-width="2.5" />

      <!-- Date Labels on X-axis -->
      <text x="40" y="145" font-size="10" fill="#70757a">Feb 16, 2026</text>
      <text x="1010" y="145" font-size="10" fill="#70757a">Oct 5, 2026</text>
    </g>
  </g>
</svg>
